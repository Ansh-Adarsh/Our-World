<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our World — Offline</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #140D11;
      color: #FFFCF9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(36, 27, 32, 0.8);
      border: 1px solid rgba(233, 141, 163, 0.3);
      padding: 2.5rem;
      border-radius: 1.5rem;
      max-width: 400px;
      margin: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-family: Georgia, serif;
      color: #E98DA3;
      margin-bottom: 0.5rem;
      font-weight: 300;
    }
    p {
      color: #9C8490;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #B83B5E, #C9A45C);
      color: #fff;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Our Garden Is Waiting ✨</h1>
    <p>You seem to be offline right now. Reconnect to the internet to resume your shared journey in Our World.</p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">Retry Connection</a>
  </div>
</body>
</html>
