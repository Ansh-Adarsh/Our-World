<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#241B20" />
    <meta name="description" content="Our World — A private little universe made for two." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph (private, minimal) -->
    <meta property="og:title" content="Our World" />
    <meta property="og:description" content="A private little universe made for two." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <title>Our World ❤️</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] ServiceWorker registered with scope:', reg.scope))
            .catch((err) => console.warn('[PWA] ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
