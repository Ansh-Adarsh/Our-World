# A Supabase config.toml for local development.
# Replace <project-ref> with your actual Supabase project reference ID.
# Find it at: https://supabase.com/dashboard/project/_/settings/general

[project]
id = "<project-ref>"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # set true in production

[storage]
enabled = true
